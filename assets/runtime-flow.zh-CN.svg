<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">ScholarPulse 运行与幂等流程</title>
  <desc id="desc">每日流程由 systemd 启动，检查当日日报是否存在，进入生成或复用路径，产出通知 JSON，再由 OpenClaw 投递至 Telegram。</desc>
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; font-weight: 400; fill: #64748B; }
      .node-title { font-family: Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .node-text { font-family: Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #64748B; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #64748B; text-anchor: middle; }
      .line { fill: none; stroke: #64748B; stroke-width: 2; marker-end: url(#arrow); }
      .blue { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 1.5; }
      .teal { fill: #F0FDFA; stroke: #2DD4BF; stroke-width: 1.5; }
      .purple { fill: #F5F3FF; stroke: #A78BFA; stroke-width: 1.5; }
      .orange { fill: #FFF7ED; stroke: #FB923C; stroke-width: 1.5; }
      .green { fill: #ECFDF5; stroke: #34D399; stroke-width: 1.5; }
      .result { fill: #F1F5F9; stroke: #475569; stroke-width: 1.5; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1400" height="560" fill="#FFFFFF"/>
  <text x="48" y="54" class="title">每日运行 · 原生幂等设计</text>
  <text x="48" y="82" class="subtitle">生产与投递通过持久化 JSON 数据边界彻底解耦</text>
  <rect x="24" y="106" width="1352" height="426" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>

  <rect x="58" y="236" width="150" height="94" rx="6" class="blue"/>
  <text x="133" y="272" class="node-title">19:55</text>
  <text x="133" y="297" class="node-text">systemd 启动 CLI</text>
  <text x="133" y="316" class="node-text">持久化调度</text>

  <rect x="254" y="236" width="170" height="94" rx="6" class="blue"/>
  <text x="339" y="272" class="node-title">日报门控</text>
  <text x="339" y="297" class="node-text">YYYY-MM-DD.md</text>
  <text x="339" y="316" class="node-text">是否已经存在？</text>

  <rect x="486" y="142" width="184" height="94" rx="6" class="teal"/>
  <text x="578" y="178" class="node-title">生成路径</text>
  <text x="578" y="203" class="node-text">采集 · 去重</text>
  <text x="578" y="222" class="node-text">摘要 · 渲染</text>

  <rect x="486" y="330" width="184" height="94" rx="6" class="green"/>
  <text x="578" y="366" class="node-title">复用路径</text>
  <text x="578" y="391" class="node-text">不查询 · 不调用模型</text>
  <text x="578" y="410" class="node-text">补建缺失索引</text>

  <rect x="734" y="236" width="174" height="94" rx="6" class="orange"/>
  <text x="821" y="272" class="node-title">原子提交</text>
  <text x="821" y="297" class="node-text">日报 + 索引</text>
  <text x="821" y="316" class="node-text">通知 JSON</text>

  <rect x="972" y="236" width="150" height="94" rx="6" class="orange"/>
  <text x="1047" y="272" class="node-title">20:00</text>
  <text x="1047" y="297" class="node-text">OpenClaw 读取</text>
  <text x="1047" y="316" class="node-text">仅消费消息</text>

  <rect x="1186" y="236" width="150" height="94" rx="6" class="result"/>
  <text x="1261" y="272" class="node-title">Telegram</text>
  <text x="1261" y="297" class="node-text">announce</text>
  <text x="1261" y="316" class="node-text">最终简报</text>

  <path d="M208 283 H254" class="line"/>
  <path d="M424 266 H454 V189 H486" class="line"/>
  <path d="M424 300 H454 V377 H486" class="line"/>
  <path d="M670 189 H700 V266 H734" class="line"/>
  <path d="M670 377 H700 V300 H734" class="line"/>
  <path d="M908 283 H972" class="line"/>
  <path d="M1122 283 H1186" class="line"/>

  <text x="455" y="176" class="label">否</text>
  <text x="456" y="367" class="label">是</text>
  <text x="940" y="269" class="label">JSON</text>
  <text x="1154" y="269" class="label">投递</text>

  <text x="58" y="486" class="subtitle">故障语义：单篇 Ollama 失败自动降级 · 单个方向失败不阻塞其他方向 · arXiv 查询全部失败返回非零状态</text>
</svg>
